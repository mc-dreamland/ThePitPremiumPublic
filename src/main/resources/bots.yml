  min-bots: 10
  max-bots: 50
  bots-per-player: 0.75
  respawn-seconds: 15
  # Base pool before shared player reward bonuses, damage sharing and prestige decay.
  # Player reward math rounds XP up after applying the bonus-bot multiplier, before damage sharing.
  experience: 10
  coins: 7.5
  target-radius: 16.0
  leash-radius: 28.0
  outgoing-per-prestige: 0.1
  incoming-per-prestige: 0.05
  min-outgoing-multiplier: 0.5
  max-incoming-multiplier: 2.0
# Bonus bots count toward normal population caps. These multipliers also affect perk currency additions.
# Player reward perks / VIP / area bonuses now apply; these base pools are not final reward caps.
# This is a per-kill comparison, not a guarantee of equal hourly earnings.
bonus-bot:
  enabled: true
  chance: 0.05
  experience-multiplier: 5.0
  coins-multiplier: 5.0
# Applies to BOTH groups. Rewards decrease with each recipient's own prestige.
rewards:
  prestige-decay:
    enabled: true
    # Full rewards through start-prestige. Every extra P subtracts 5 percentage points; floor 10%.
    start-prestige: 15
    reduction-per-prestige: 0.05
    minimum-multiplier: 0.10
  contribution-timeout-seconds: 30
  minimum-damage-share: 0.05
# Caps raw weapon/projectile damage against bots, before prestige scaling.
max-player-hit-damage: 10.0
