# MythicMobs 5.8.2 / Paper 1.20.6.
# Coordinates and population settings match the supplied server configuration (world).
# Health, damage, movement, armor, equipment and Disguise belong in MythicMobs/mobs/PitTrainingBots.yml.
config-version: 9
enabled: true
# Only the eligible final attacker advances this counter; high P still gets ordinary perk kill effects.
kill-streak:
  enabled: true
  max-prestige: 10
  # Stops at this CURRENT total streak, not an additional number of Bot kills.
  # Effective limit also stays below the earliest mega-streak threshold (currently at most 49).
  max-streak: 30
admin:
  # Manual /pitbot spawn bots survive idle cleanup, then expire (10..3600 seconds).
  forced-bot-lifetime-seconds: 300
training:
  enabled: true
  # Names stay visible. Bonus bots use the same label with a different color.
  display-name: '&a[Bot] &7训练陪练'
  bonus-display-name: '&6[Bot] &c训练陪练'
  # Only these players increase automatic population / become passive targets; all P may fight.
  spawn-max-prestige: 10
  min-bots: 2
  # Configuration limit, not a hard-coded ceiling.
  max-bots: 10
  bots-per-player: 1.0
  # Independent training refill-check interval; spawn attempts are spread across ticks.
  respawn-seconds: 5
  # Base pool before shared player reward bonuses, damage sharing and prestige decay.
  # Final rewards also depend on equipped perks, VIP/area boosts and the bonus-bot multiplier.
  experience: 5.0
  coins: 5.0
  target-radius: 14.0
  leash-radius: 24.0
  # Players walk in/out freely. Inside PvP deals 10% damage; cross-boundary PvP is blocked.
  # There are no entry/exit commands.
  # Use /pitbot pos1 training and /pitbot pos2 training to change corners.
  pos1:
    ==: org.bukkit.Location
    world: world
    x: 302.5
    y: 103.0
    z: 299.5
    pitch: 5.999852
    yaw: -42.00586
  pos2:
    ==: org.bukkit.Location
    world: world
    x: 322.5
    y: 108.0
    z: 319.5
    pitch: 31.79972
    yaw: 132.13803
