# 仅隐藏玩家头顶的名字，前缀和后缀仍会显示。
# 通过数据包、客户端不可见别名和原版计分板队伍实现，无需文本展示实体或盔甲架。
# 服务器记录的账号名、UUID 和皮肤保持原样，Tab 玩家列表保留原来的显示文字。
# 修改 plugins/ThePitPremium 下的此文件后，执行 /namehide reload（需要 pit.admin 权限）。
# /namehide status 可查看当前生效的设置。将 enabled 设为 false 可恢复所有受影响的头顶名字。
enabled: true

# 精通范围包含最小值与最大值，按玩家的实际精通等级判断。
prestige:
  min: 2
  max: 10

# 按被观察玩家所在的位置判断。出生区与中央区重叠时，优先按出生区处理。
# 出生区沿用 PitLocA/PitLocB。中央区沿用疯狂天坑的中心、半径和高度。
# 野外是同一游戏世界中除出生区和中央区以外的范围。其他世界不受影响。
areas:
  spawn: false
  middle: true
  wild: true

# 达到连杀或赏金任一阈值时，显示该玩家的头顶名字，
# 即使玩家的精通等级处于隐藏范围内。对应值设为 -1 可关闭这项例外。
# 普通或大型事件进行中，以及超连杀激活期间，始终显示相应玩家的头顶名字。
show-above-streak: 30
show-above-bounty: 1000

# 在主线程检查规则。合并重复变化，显示状态未变时无需发送数据包。
refresh-ticks: 10
# 等待指定 tick 数以合并变化，再按全服每 tick 的上限处理「观察者与被观察玩家」组合。
# 20 TPS 时，10 tick 等于 0.5 秒。实际延迟还受规则检查间隔和排队情况影响。
change-delay-ticks: 10
packet-updates-per-tick: 256
# 仅当客户端已收到真实玩家资料、需要将其替换为别名时，才刷新玩家资料和实体。这类刷新开销较高。
# 常规的区域切换、显形药水、事件和连杀状态变化只更新计分板队伍。
profile-refreshes-per-tick: 16

# 显形药水可在普通商店购买。使用后，仅使用者可以看到原本被隐藏的名字。
# 效果仅在当前登录期间有效，重连或服务器重启会清除效果。效果未结束时再次使用不会消耗道具。
reveal-item:
  enabled: true
  price: 500
  duration-seconds: 300
